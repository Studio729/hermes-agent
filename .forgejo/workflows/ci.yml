name: Forgejo CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: forgejo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.6"
      - name: Install linters
        run: uv tool install ruff==0.15.10
      - name: Ruff
        run: ruff check .
      - name: Lockfile consistency
        run: uv lock --check
      - name: Package build
        run: uv build --sdist --wheel
      - name: Shell scripts
        run: shellcheck --severity=error docker/*.sh scripts/ci/*.sh
      - name: Windows footguns
        run: python3 scripts/check-windows-footguns.py --all
      - name: Validate Forgejo workflows
        run: |
          set -euo pipefail
          for workflow in .forgejo/workflows/*.yml; do
            forgejo-runner validate --workflow --path "$workflow"
          done

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.6"
      - name: Set up Python
        run: |
          set -euo pipefail
          uv_bin="$(command -v uv)"
          if [[ "$uv_bin" != /usr/local/bin/uv ]]; then
            install -m 0755 "$uv_bin" /usr/local/bin/uv
          fi
          bash scripts/ci/prepare-unprivileged-workspace.sh node node
          env -i \
            HOME=/root \
            LANG=C.UTF-8 \
            PATH=/usr/local/bin:/usr/bin:/bin \
            UV_PYTHON_INSTALL_DIR="$GITHUB_WORKSPACE/.uv-python" \
            /usr/local/bin/uv python install 3.11
      - name: Install dependencies as unprivileged user
        run: |
          set -euo pipefail
          runuser -u node -- env -i \
            HOME=/home/node \
            LANG=C.UTF-8 \
            PATH=/usr/local/bin:/usr/bin:/bin \
            TZ=UTC \
            UV_CACHE_DIR="$GITHUB_WORKSPACE/.uv-cache" \
            UV_PYTHON_INSTALL_DIR="$GITHUB_WORKSPACE/.uv-python" \
            VIRTUAL_ENV="$GITHUB_WORKSPACE/.venv" \
            bash --noprofile --norc scripts/ci/run-unprivileged-install.sh
      - name: Run isolated unit tests
        env:
          # The DIND runner reports the host CPU count. The test harness
          # doubles that value by default, which overcommits the isolated job
          # container and turns SQLite tests into timeout failures.
          HERMES_TEST_WORKERS: "4"
        run: |
          set -euo pipefail
          # Match the non-root, host-like GitHub runner contract while keeping
          # the job inside the isolated Forgejo container. Docker's marker
          # otherwise makes host-environment unit tests take container-only
          # branches, and the synthetic bus path keeps mocked systemd tests
          # from probing the real (absent) user session.
          rm -f /.dockerenv
          install -d -m 0700 -o node -g node /run/user/1000
          install -m 0600 -o node -g node /dev/null /run/user/1000/bus
          runuser -u node -- env -i \
            DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus \
            HERMES_TEST_WORKERS="$HERMES_TEST_WORKERS" \
            HOME=/home/node \
            LANG=C.UTF-8 \
            PATH="$GITHUB_WORKSPACE/.venv/bin:/usr/local/bin:/usr/bin:/bin" \
            PYTEST_ADDOPTS="--timeout=90 -o timeout_func_only=true" \
            TMPDIR=/tmp \
            TZ=UTC \
            VIRTUAL_ENV="$GITHUB_WORKSPACE/.venv" \
            XDG_RUNTIME_DIR=/run/user/1000 \
            bash --noprofile --norc scripts/ci/run-unprivileged-tests.sh

  e2e:
    name: Packaged wheel and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.6"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"
      - name: Run E2E suite
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          source .venv/bin/activate
          python -m pytest -m integration tests/test_wheel_locales_e2e.py -v
          python -m pytest tests/e2e/ -v --tb=short

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        working-directory: website
        run: npm ci
      - name: Generate and build docs
        run: |
          python3 -m pip install --break-system-packages ascii-guard==2.3.0 pyyaml==6.0.3
          python3 website/scripts/extract-skills.py
          python3 website/scripts/generate-skill-docs.py
          npm --prefix website run lint:diagrams
          npm --prefix website run build

  vulnerabilities:
    name: OSV lockfile scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Scan pinned dependencies
        run: |
          set +e
          osv-scanner scan \
            --lockfile=uv.lock \
            --lockfile=package-lock.json \
            --lockfile=website/package-lock.json
          status=$?
          set -e
          if [[ "$status" -eq 1 ]]; then
            echo "OSV reported known vulnerabilities; detection is advisory."
          elif [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi

  container:
    name: Docker lint, build, and integration
    needs: [quality, tests, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Hadolint
        run: >-
          docker run --rm -i hadolint/hadolint@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e
          hadolint --failure-threshold warning
          --ignore DL3008 --ignore DL3003 --ignore DL3059 --ignore DL3002
          --trusted-registry docker.io --trusted-registry ghcr.io - <Dockerfile
      - name: Build image
        run: docker build --tag hermes-agent:forgejo-ci .
      - name: Smoke image
        uses: ./.github/actions/hermes-smoke-test
        with:
          image: hermes-agent:forgejo-ci
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.6"
      - name: Run Docker integration tests
        env:
          HERMES_TEST_IMAGE: hermes-agent:forgejo-ci
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          uv python install 3.11
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[dev]"
          python -m pytest tests/docker/ -v --tb=short
